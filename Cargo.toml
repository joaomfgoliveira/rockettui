[package]
name = "rockettui"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
crossterm = { version = "0.29", features = ["event-stream"] }
futures = "0.3"
ratatui = "0.30"
textwrap = "0.16"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
toml = { version = "1.2.1", default-features = false, features = ["parse", "std"] }
unicode-segmentation = "1"
unicode-width = "0.2"

[dev-dependencies]
insta = "1"
